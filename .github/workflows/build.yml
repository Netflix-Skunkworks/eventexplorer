name: CI

# Entry-point workflow for corp/eventexplorer.
#
# Lint/test runs here as an inline `check` job; the release-binary and
# wasm builds are delegated to the shared reusable workflow in
# gha/eventexplorer (the only repo allowed to host the build actions on
# this GHES instance). Keeping `check` local means a fmt/clippy/test
# regression is caught even when the reusable build is green.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: fmt + clippy + test
    runs-on:
      - nf.detail:small

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + rustfmt + clippy)
        shell: bash
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup update stable --no-self-update
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- --default-toolchain stable -y --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      # Registry/git only — saving `target/` overflows nf.detail:small.
      - name: Cache cargo registry
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: check-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            check-cargo-registry-

      - name: Install Linux build dependencies
        # clippy --all-targets and the tests compile the native GUI,
        # which links against X11 / xkbcommon / OpenSSL.
        #
        # A runner can still be running its own apt (unattended upgrades)
        # when the job starts; wait for the dpkg lock rather than exiting 100.
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  build:
    name: build artifacts
    uses: gha/eventexplorer/.github/workflows/build.yml@main
